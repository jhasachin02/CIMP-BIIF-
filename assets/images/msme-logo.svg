<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 110" width="100%" height="100%">
  <!-- MSME Govt of India Logo Vector -->
  <defs>
    <linearGradient id="msmeOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="msmeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3C68"/>
      <stop offset="100%" stop-color="#031E38"/>
    </linearGradient>
  </defs>

  <!-- National Ashoka Emblem / Stylized Emblem -->
  <g transform="translate(15, 10)">
    <circle cx="45" cy="45" r="42" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="45" cy="45" r="36" fill="#FFFFFF" stroke="#0B3C68" stroke-width="1.5" stroke-dasharray="3,2"/>
    
    <!-- Central Gear / Growth Icon -->
    <path d="M45,22 L48,28 L55,28 L51,33 L53,39 L45,35 L37,39 L39,33 L35,28 L42,28 Z" fill="url(#msmeOrange)"/>
    <circle cx="45" cy="48" r="14" fill="none" stroke="#0B3C68" stroke-width="3"/>
    <path d="M45,37 L45,59 M34,48 L56,48 M37,40 L53,56 M37,56 L53,40" stroke="#0B3C68" stroke-width="2"/>
    <circle cx="45" cy="48" r="4" fill="#E65100"/>
    
    <!-- Rising Wings / Leaves -->
    <path d="M26,62 C34,68 45,72 45,72 C45,72 56,68 64,62 C58,68 48,74 45,74 C42,74 32,68 26,62 Z" fill="#138808"/>
    <path d="M28,68 C35,73 45,76 45,76 C45,76 55,73 62,68" fill="none" stroke="#138808" stroke-width="1.5"/>
  </g>

  <!-- Typography -->
  <text x="115" y="32" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#0B3C68" letter-spacing="0.2">
    सूक्ष्म, लघु एवं मध्यम उद्यम मंत्रालय
  </text>
  <text x="115" y="52" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#0B3C68" letter-spacing="-0.3">
    MINISTRY OF MSME
  </text>
  <text x="115" y="70" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#E65100" letter-spacing="0.5">
    GOVERNMENT OF INDIA
  </text>
  <text x="115" y="88" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#64748B" letter-spacing="0.3">
    MSME Idea Hackathon • Host Institute Scheme
  </text>
</svg>
