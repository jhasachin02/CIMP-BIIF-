<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 110" width="100%" height="100%">
  <!-- Startupandi Logo Vector -->
  <defs>
    <linearGradient id="saPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <g transform="translate(15, 10)">
    <!-- Brand Icon -->
    <rect x="3" y="3" width="84" height="84" rx="20" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="2"/>
    
    <!-- Rocket + Star -->
    <path d="M45,20 C45,20 57,27 57,45 C57,55 52,60 52,60 L38,60 C38,60 33,55 33,45 C33,27 45,20 45,20 Z" fill="url(#saPurple)"/>
    <circle cx="45" cy="38" r="5" fill="#FFFFFF"/>
    <path d="M33,48 L27,55 L34,57 Z" fill="#F59E0B"/>
    <path d="M57,48 L63,55 L56,57 Z" fill="#F59E0B"/>
    <path d="M41,60 L45,68 L49,60 Z" fill="#EF4444"/>
  </g>

  <!-- Typography -->
  <text x="115" y="32" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#7C3AED" letter-spacing="0.8">
    A CIMP FACULTY-LED INITIATIVE
  </text>
  <text x="115" y="55" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
    Startup<tspan fill="#7C3AED">andi</tspan><tspan fill="#F59E0B">.com</tspan>
  </text>
  <text x="115" y="73" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="0.2">
    GLOBAL &amp; NATIONAL STARTUP MEDIA
  </text>
  <text x="115" y="90" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#7C3AED" letter-spacing="0.3">
    Daily Intelligence • Case Studies • Startupandi Magazine
  </text>
</svg>
